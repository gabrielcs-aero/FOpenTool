<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FOpenTool</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a classic Windows engineering window. Menu bar, three control rulers, edit toolbar on the left, drawing canvas, attribute panel on the right, coordinate bar at the bottom. Single light look on purpose (the Display menu switches the canvas background). */
:root{
  --chrome:#F0F0F0; --chrome-line:#D4D4D4; --chrome-dark:#A0A0A0; --text:#000000; --muted:#6D6D6D; --disabled:#A8A8A8;
  --field:#FFFFFF; --field-line:#7A7A7A; --hot:#E5F1FB; --hot-line:#0078D7; --on:#CCE4F7; --on-line:#3D8EE0;
  --icon:#1414E6; --icon-red:#D00000; --msg:#D00000; --canvas-line:#666666;
  --ui:"Segoe UI",Tahoma,"Helvetica Neue",Arial,sans-serif; --num:"Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--chrome);color:var(--text);font:12px/1.35 var(--ui)}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
.win{height:100%;display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr) auto;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.menubar{display:flex;gap:0;background:#FFFFFF;border-bottom:1px solid var(--chrome-line);padding:0 4px}
.menubar>button{background:none;border:1px solid transparent;padding:2px 7px;font-size:13px;cursor:default}
.menubar>button:hover,.menubar>button[aria-expanded="true"]{background:var(--hot);border-color:var(--hot-line)}
.tb{display:flex;align-items:center;gap:2px;padding:2px 6px;border-bottom:1px solid var(--chrome-line);flex-wrap:wrap;min-height:30px}
.sep{width:1px;align-self:stretch;background:var(--chrome-line);margin:2px 8px}
.spacer{flex:1}
.ib{width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid transparent;border-radius:2px;background:none;padding:0;cursor:default;color:var(--icon)}
.ib svg{width:20px;height:20px;display:block}
.ib:hover:not(:disabled){background:var(--hot);border-color:var(--hot-line)}
.ib[aria-pressed="true"]{background:var(--on);border-color:var(--on-line)}
.ib:disabled{color:var(--disabled);opacity:.55}
.tl{font-size:10px;line-height:1.05;text-align:center;color:var(--disabled);padding:0 3px;border:1px solid transparent;background:none}
.tl.act{color:var(--icon)} .tl.act:hover{background:var(--hot);border-color:var(--hot-line)}
.lbl{font-weight:600;margin-left:6px;white-space:nowrap}
.box{background:var(--field);border:1px solid #E1E1E1;padding:1px 8px;min-width:90px;color:var(--muted);white-space:nowrap}
.tb select{height:22px;border:1px solid var(--chrome-line);background:var(--field)}
.tb select:disabled{color:var(--disabled)}
.num{height:21px;border:1px solid var(--chrome-line);background:var(--field);text-align:right;padding:0 4px;font-family:var(--num);width:64px}
.num:focus{outline:1px solid var(--hot-line)}
#pot{width:96px;accent-color:#0078D7}
#msg{color:var(--msg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.main{display:grid;grid-template-columns:34px minmax(0,1fr) 222px;min-height:0}
.ltb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;border-right:1px solid var(--chrome-line)}
.ltb .gap{flex:1;min-height:8px}
.dial{width:22px;height:84px;border:1px solid var(--chrome-dark);cursor:ns-resize;touch-action:none;
  background:repeating-linear-gradient(180deg,#6B6B6B 0 2px,#B9B9B9 2px 4px,#E8E8E8 4px 6px,#B9B9B9 6px 8px)}
.cvwrap{position:relative;border:1px solid var(--canvas-line);margin:4px;min-height:0;background:#FFFFFF}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.side{border-left:1px solid var(--chrome-line);padding:8px 8px 12px;overflow:auto;min-height:0}
.side.off{opacity:.55;pointer-events:none}
.pt{font-weight:700;text-align:center;margin:0 0 6px;font-size:12.5px}
.side select.lst{width:100%;height:24px;border:1px solid var(--chrome-line);background:var(--field)}
.grp{border:1px solid var(--chrome-dark);border-radius:2px;padding:4px;margin:6px auto;display:flex;flex-direction:column;align-items:center;gap:2px;width:fit-content}
.grp .row{display:flex;gap:2px;justify-content:center}
.fl{display:grid;grid-template-columns:44px 84px auto;align-items:center;gap:3px 4px;justify-content:center;margin:2px 0}
.fl label{text-align:right}
.fl input{height:21px;border:1px solid var(--chrome-line);background:var(--field);text-align:right;padding:0 4px;width:84px}
.fl input[readonly]{background:#F7F7F7;color:#333}
.fl .u{color:#000;white-space:nowrap}
.fs{border:1px solid var(--chrome-line);border-radius:2px;padding:4px 6px;margin:6px 0;display:flex;flex-direction:column;gap:3px}
.fs legend{padding:0 3px}
.ck{display:flex;align-items:center;gap:4px}
.ck input{margin:0}
.dirs{display:grid;grid-template-columns:auto auto;gap:4px 10px;justify-content:center}
.shape{display:block;margin:4px auto}
.sh{font-weight:700;text-align:center;margin-top:6px}
.newf{display:flex;flex-direction:column;gap:4px;margin:2px 0 6px}
.newf .nl{text-align:center}
.newf #newName{height:22px;border:0;border-bottom:2px solid var(--hot-line);background:var(--field);width:150px;margin:0 auto 4px;padding:0 4px}
.newf select{border:1px solid var(--chrome-line);background:var(--field);width:100%}
.tree details{margin:1px 0}
.tree summary{list-style:none;cursor:default;padding-left:2px}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▶";display:inline-block;font-size:9px;width:14px}
.tree details[open]>summary::before{content:"▼"}
.tree .ck{padding:1px 0 1px 16px}
.tree .ck.na{color:var(--disabled)}
.btnrow{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.pb{min-width:64px;height:24px;border:1px solid #ADADAD;background:#E1E1E1;border-radius:2px;padding:0 10px;cursor:default}
.pb:hover{background:var(--hot);border-color:var(--hot-line)}
.pb.def{border-color:var(--hot-line)}
.info{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12px}
.info dt{color:var(--muted)} .info dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.tabs{display:flex;border-bottom:1px solid var(--chrome-line);margin-bottom:6px}
.tabs button{flex:1;border:1px solid transparent;border-bottom:0;background:none;padding:3px 0;cursor:default}
.tabs button[aria-selected="true"]{background:var(--field);border-color:var(--chrome-line);margin-bottom:-1px}
.status{display:flex;align-items:center;gap:6px;padding:3px 6px;border-top:1px solid var(--chrome-line);flex-wrap:wrap}
.status .num{width:58px}
.status .ro{background:#F7F7F7;border:1px solid var(--chrome-line);height:21px;min-width:80px;padding:1px 4px;font-variant-numeric:tabular-nums}
.menu{position:fixed;z-index:30;background:#F2F2F2;border:1px solid #CCCCCC;box-shadow:2px 3px 6px rgba(0,0,0,.25);padding:2px;min-width:230px}
.menu button{display:grid;grid-template-columns:22px 1fr auto;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;padding:3px 6px 3px 2px;cursor:default}
.menu button:hover:not(:disabled){background:var(--hot);border-color:var(--hot-line)}
.menu button:disabled{color:var(--disabled)}
.menu hr{border:0;border-top:1px solid #D7D7D7;margin:3px 2px 3px 26px}
.menu .chk::before{content:"✓";font-weight:700;padding-left:5px}
.menu .rad::before{content:"•";font-weight:700;padding-left:7px;font-size:15px;line-height:1}
.menu .sub{color:var(--muted);padding:3px 6px 1px 26px;font-size:11px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.18);display:grid;place-items:center;z-index:40;padding:16px}
.dlg{background:var(--chrome);border:1px solid #888;box-shadow:0 8px 24px rgba(0,0,0,.3);min-width:min(340px,100%);max-width:min(620px,100%);max-height:calc(100% - 8px);overflow:auto}
.dlg .tt{background:#FFFFFF;padding:6px 10px;border-bottom:1px solid var(--chrome-line);display:flex;justify-content:space-between;align-items:center}
.dlg .tt b{font-weight:400}
.dlg .bd{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.dlg .x{border:0;background:none;font-size:16px;width:28px;cursor:default}
.dlg .x:hover{background:#E81123;color:#fff}
.dlg table{border-collapse:collapse}
.dlg td{padding:2px 6px}
.dlg textarea{width:100%;height:220px;font:12px Consolas,monospace;border:1px solid var(--chrome-line)}
.ssv{position:absolute;right:8px;bottom:8px;width:400px;max-width:calc(100% - 16px);height:240px;background:#FFFFFF;border:1px solid #888;box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:4}
.ssv canvas{width:100%;height:100%;display:block}
.ssn{display:flex;flex-direction:column;gap:6px}
.ssn .f{font-family:"Cambria Math","Times New Roman",serif;font-size:13px;text-align:center;margin:2px 0}
.ssn h5{margin:6px 0 2px;font-size:12px}
.ssn table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ssn td{padding:1px 2px;font-size:11.5px;vertical-align:top} .ssn td:first-child{color:var(--muted);padding-right:6px} .ssn td:last-child{text-align:right}
.mt{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.mt th{text-align:right;border-bottom:1px solid var(--chrome-line);padding:2px 3px;font-weight:600} .mt th:first-child,.mt td:first-child{text-align:left}
.mt td{text-align:right;padding:2px 3px;border-bottom:1px solid #E6E6E6}
.mt tr[data-act]{cursor:default} .mt tr[data-act]:hover td{background:var(--hot)}
.tT{color:#C00000} .tC{color:#0000C0} .tZ{color:var(--muted)}
.kd{position:absolute;left:8px;top:8px;background:var(--chrome);border:1px solid #888;box-shadow:0 4px 12px rgba(0,0,0,.25);padding:8px;z-index:5;display:flex;flex-direction:column;gap:6px}
.kd .ttl{font-weight:700}
.kd .g{display:grid;grid-template-columns:auto 76px auto auto 76px;gap:3px 4px;align-items:center}
.kd input{height:21px;border:1px solid var(--chrome-line);text-align:right;padding:0 4px;width:76px}
:focus-visible{outline:1px dotted #000;outline-offset:1px}
.ftxt{font:12px/1.35 "Courier New",Consolas,monospace;margin:0;white-space:pre;overflow-x:auto}
.ugrid-top{display:grid;grid-template-columns:repeat(3,1fr);justify-items:center}
.ufs{display:grid;grid-template-columns:112px minmax(0,200px) auto minmax(0,110px);gap:3px 8px;align-items:center;border:1px solid var(--chrome-dark);margin:0;padding:4px 6px}
.ufs label:nth-child(4n+3){justify-self:end;margin-left:10px}
.ufs select{height:23px;border:1px solid var(--chrome-line);background:var(--field);min-width:0}
.ufs select:disabled{color:var(--disabled)}
.dlg .sk{display:block;margin:0 auto}
.dlg .ctr{text-align:center;margin:0}
.kd .tabsv{display:flex;gap:4px}
.kd .vt{display:flex;flex-direction:column;gap:2px}
.kd .vt button{writing-mode:vertical-rl;transform:rotate(180deg);border:1px solid var(--chrome-line);background:var(--chrome);padding:6px 2px;cursor:default;font-size:11px}
.kd .vt button[aria-selected="true"]{background:var(--field);border-right-color:var(--field)}
.kd fieldset{border:1px solid var(--chrome-dark);padding:4px 6px;margin:0}
@media print{ body *{visibility:hidden} #cv{visibility:visible;position:fixed;inset:0;width:100%!important;height:auto!important} }
@media (max-width:820px){
  html,body{height:auto}
  .win{height:auto}
  .main{grid-template-columns:34px minmax(0,1fr)}
  .cvwrap{height:62vh;height:62svh;min-height:320px}
  .side{grid-column:1 / -1;border-left:0;border-top:1px solid var(--chrome-line)}
  .ltb .gap{display:none}
}
</style>

<div class="win">
  <div class="menubar" role="menubar">
    <button data-menu="file" aria-haspopup="true" aria-expanded="false">File</button>
    <button data-menu="options" aria-haspopup="true" aria-expanded="false">Options</button>
    <button data-menu="display" aria-haspopup="true" aria-expanded="false">Display</button>
  </div>
  <div class="tb">
    <button class="ib" id="bNew" title="New"></button>
    <button class="ib" id="bOpen" title="Open"></button>
    <button class="ib" id="bSave" title="Save"></button>
    <button class="ib" id="bPrint" title="Print" disabled></button>
    <button class="ib" id="bClip" title="Export screen to clipboard (Ctrl+C)"></button>
    <span class="sep"></span>
    <button class="ib" id="bUndo" title="Undo (Ctrl+Z)"></button>
    <button class="ib" id="bRedo" title="Redo (Ctrl+Y)"></button>
    <span class="spacer"></span>
    <span class="lbl">Load Case:</span><select disabled aria-label="Load case"><option>Load Case 01</option></select>
    <span class="sep"></span>
    <span class="lbl">Load Train:</span><select disabled aria-label="Load train"><option>NONE</option></select>
  </div>
  <div class="tb">
    <button class="ib" data-panel="mat" title="Material Parameters"></button>
    <button class="ib" data-panel="sec" title="Section Properties"></button>
    <button class="ib" data-panel="sup" title="Support Conditions"></button>
    <button class="ib" data-panel="hinge" title="Rotation Release"></button>
    <button class="ib" data-panel="dc" title="Deformation Constraints"></button>
    <span class="sep"></span>
    <button class="ib" data-panel="nodal" title="Nodal Loading"></button>
    <button class="ib" data-panel="endm" title="Member End Moments"></button>
    <button class="ib" data-panel="unif" title="Uniform Loading"></button>
    <button class="ib" data-panel="lin" title="Linear Loading"></button>
    <button class="ib" data-panel="therm" title="Thermal Loading"></button>
    <span class="sep"></span>
    <button class="tl" disabled title="Load cases (advanced edition)">Load<br>Case</button>
    <button class="tl" disabled title="Load combinations (advanced edition)">Load<br>Cmb</button>
    <button class="tl" disabled title="Load trains are not in this version yet">Load<br>Train</button>
    <span id="modeBox" style="display:flex;align-items:center;gap:4px"></span>
    <span class="spacer"></span>
    <input type="range" id="pot" min="-100" max="100" value="0" title="Result scale" aria-label="Result scale">
    <span class="sep"></span>
    <button class="ib" data-rmode="diag" title="Diagram results"></button>
    <button class="ib" data-rmode="il" title="Influence Line results"></button>
    <button class="ib" data-rmode="env" title="Load-train envelopes are not in this version yet" disabled></button>
    <span class="sep"></span>
    <button class="ib" data-q="N" title="Axial Force"></button>
    <button class="ib" data-q="V" title="Shear Force"></button>
    <button class="ib" data-q="M" title="Bending Moment"></button>
    <button class="ib" data-q="D" title="Deformed Configuration"></button>
    <select id="defComp" title="Deformed configuration component shown with values" aria-label="Deformed component" style="width:44px;height:22px;border:1px solid var(--chrome-line);background:#fff"><option value="Dy">DY</option><option value="Dx">DX</option><option value="Rz">RZ</option><option value="none">—</option></select>
    <button class="ib" data-q="S" title="Section Stresses (normal and shear stresses in a cross-section)"></button>
    <button class="ib" id="bIlPick" title="Select a section for the influence line" hidden></button>
  </div>
  <div class="tb">
    <span id="msg" role="status"></span>
    <span class="lbl">Step:</span><input class="num" id="step" value="0.00" aria-label="Step"><span id="stepU">m</span>
    <button class="ib" id="bStepDiv" title="Divide each member into equal segments no longer than the step"></button>
    <button class="ib" id="bStepStart" title="Take steps from the start of each member"></button>
  </div>
  <div class="main">
    <div class="ltb">
      <button class="ib" data-tool="select" title="Select members or nodes (ESC)"></button>
      <button class="ib" data-tool="member" title="Insert member (M)"></button>
      <button class="ib" data-tool="node" title="Insert node (N)"></button>
      <button class="ib" data-tool="dim" title="Insert dimension line (D)"></button>
      <button class="ib" id="bKbd" title="Keyboard mode (K)"></button>
      <button class="ib" id="bDel" title="Delete selected objects (DEL)"></button>
      <span style="height:6px"></span>
      <button class="ib" id="bTrf" title="Transform selected objects (T)"></button>
      <span class="gap"></span>
      <button class="ib" id="bRedraw" title="Redraw (R)"></button>
      <button class="ib" id="bFit" title="Fit model to screen (F)"></button>
      <button class="ib" data-tool="zoom" title="Zoom window (Z)"></button>
      <button class="ib" id="bZin" title="Zoom in (+)"></button>
      <button class="ib" id="bZout" title="Zoom out (−)"></button>
      <div class="dial" id="dial" title="Zoom wheel: drag up or down"></div>
    </div>
    <div class="cvwrap" id="stage"><canvas id="cv"></canvas><div class="kd" id="kd" hidden></div><div class="ssv" id="ssv" hidden><canvas id="scv"></canvas></div></div>
    <aside class="side" id="side"></aside>
  </div>
  <div class="status">
    <span>H:</span><input class="num" id="vH" aria-label="View width"><span class="uL">m</span>
    <span>V:</span><input class="num" id="vV" aria-label="View height"><span class="uL">m</span>
    <span class="ro" id="cX">X:</span><span class="ro" id="cY">Y:</span>
    <span class="spacer"></span>
    <label class="ck"><input type="checkbox" id="gOn"> Grid</label>
    <span>X:</span><input class="num" id="gX" aria-label="Grid spacing X"><span class="uL">m</span>
    <span>Y:</span><input class="num" id="gY" aria-label="Grid spacing Y"><span class="uL">m</span>
    <label class="ck"><input type="checkbox" id="gSnap"> Snap</label>
  </div>
</div>
<div class="menu" id="menu" hidden role="menu"></div><div class="menu" id="menu2" hidden role="menu"></div>
<div class="ov" id="ov" hidden><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"><div class="tt"><b id="dlgT"></b><button class="x" data-close aria-label="Close">✕</button></div><div class="bd" id="dlgB"></div></div></div>
<input type="file" id="fOpen" accept=".ftl,.json,application/json" hidden>

    case 'ring': { const Di=P.D-2*P.t; A=Math.PI*(P.D**2-Di**2)/4; As=A/2; I=Math.PI*(P.D**4-Di**4)/64; d=P.D; yb=d/2; break; }
